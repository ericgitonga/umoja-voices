name: E2E (Preview)

# Gates a PR on the golden-path E2E suite (#44) running against the Preview/
# Development Supabase project (#52) — never production. Requires a
# VERCEL_TOKEN repository secret (Vercel dashboard -> Account Settings ->
# Tokens) with access to the egm2/umoja-voices project; org/project IDs
# below are plain identifiers (same ones in the gitignored .vercel/
# project.json), not secrets.

on:
  pull_request:
    branches: [main]

env:
  VERCEL_ORG_ID: team_zqkuLyNQ340W09pXdT0og99l
  VERCEL_PROJECT_ID: prj_X8TUYCwWk2pLCVGVks5nwRVWJYt1

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci

      - name: Pull Preview/Development env vars (never Production)
        run: npx vercel env pull .env.local --environment=preview --token=${{ secrets.VERCEL_TOKEN }} --yes

      - name: Apply pending migrations to the Preview/dev database
        run: npx prisma migrate deploy

      - run: npm run build

      - name: Start server
        # Output redirected to a file rather than left to inherit the step's
        # own stdout: GitHub Actions stops capturing a backgrounded (`&`)
        # process's output once the step that launched it exits (confirmed
        # directly — server-side console.log calls from later requests
        # never appeared in any step's log, even in test runs where those
        # server actions definitely ran). "Print server log" below cats
        # this file so it's actually visible regardless of outcome.
        run: |
          npm run start > /tmp/server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/login > /dev/null && exit 0
            sleep 1
          done
          echo "Server did not become ready in time" >&2
          exit 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright (Python)
        run: |
          pip install playwright requests python-dotenv
          playwright install --with-deps chromium

      - name: Compute today's UTC date
        id: date
        run: echo "date=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      # test_video_upload.py uploads/plays/deletes a real ~11MB file against
      # the hosted dev Supabase project (#52) -- disproportionate egress cost
      # to pay on every push to an active PR, since the proxy body-size
      # regression it guards (#58) doesn't change from run to run. A daily
      # marker, keyed by UTC date and restored via cache, lets it run once
      # per calendar day and skip on every other trigger that same day; every
      # other spec is unaffected and still runs on every trigger.
      - name: Restore today's video-upload-test marker
        id: video-marker
        uses: actions/cache@v4
        with:
          path: .ci-cache/video-upload-ran
          key: video-upload-e2e-${{ steps.date.outputs.date }}

      - name: Create today's video-upload-test marker
        if: steps.video-marker.outputs.cache-hit != 'true'
        run: mkdir -p .ci-cache && touch .ci-cache/video-upload-ran

      - name: Run E2E suite
        env:
          E2E_SKIP_MODULES: ${{ steps.video-marker.outputs.cache-hit == 'true' && 'test_video_upload' || '' }}
        run: python e2e/run.py

      - name: Print server log
        if: always()
        run: cat /tmp/server.log
